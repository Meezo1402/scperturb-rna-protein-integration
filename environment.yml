# conda env create -f environment.yml && conda activate scpert
name: scpert
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - anndata>=0.10
  - scanpy>=1.10
  - scikit-misc
  - scrublet
  - leidenalg
  - python-igraph
  - pydeseq2
  - statsmodels
  - pyyaml
  - matplotlib
  - pytest
  - r-base>=4.3
  - bioconductor-mixomics
