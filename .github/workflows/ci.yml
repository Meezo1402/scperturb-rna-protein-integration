name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Synthetic data
        run: python scripts/00_make_synthetic_data.py
      - name: Smoke run (qc, normalize, edist, de, export)
        run: python scripts/run_pipeline.py --config config/smoke.yaml
      - name: Show summary
        run: cat results/smoke/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            results/smoke/summary.md
            results/smoke/*.csv
            results/smoke/*.png
            results/smoke/de
            results/smoke/diablo_input

  diablo:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-results
          path: results/smoke
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install mixOmics
        run: |
          Rscript -e 'install.packages("BiocManager"); BiocManager::install("mixOmics", ask = FALSE, update = FALSE)'
      - name: DIABLO on the smoke export
        run: Rscript scripts/06_diablo_integration.R --input results/smoke/diablo_input --out results/smoke/diablo --nrepeat 3
      - name: Show metrics
        run: cat results/smoke/diablo/diablo_metrics.csv
      - uses: actions/upload-artifact@v4
        with:
          name: diablo-results
          path: results/smoke/diablo
